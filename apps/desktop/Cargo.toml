[package]
name = "branchline-git"
version = "0.1.0"
description = "A high-performance Git desktop client"
authors = ["Branchline"]
edition = "2021"

[lib]
name = "branchline_git_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

